<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First HTML Page</title>
</head>

<body>

  <!-- h1 tag -->
  <h1>Hello! I'm Kiruthiksha</h1>

  <!-- p tag -->
  <p>This is my first HTML page. I'm learning Full Stack Development!</p>

  <!-- ul tag (unordered list) -->
  <ul>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
  </ul>

  <!-- ol tag (ordered list) -->
  <ol>
    <li>Learn HTML</li>
    <li>Learn CSS</li>
    <li>Build Projects</li>
  </ol>

  <!-- a tag (link) -->
  <a href="https://www.google.com">Visit Google</a>

  <!-- img tag -->
  <img src="https://picsum.photos/200" alt="Sample Image">

</body>

</html>
